services:
  # ClassPilot: Self-hosted Grade 6 teacher plan book (SQLite persistence)
  classpilot:
    build:
      context: .
    container_name: classpilot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${CLASSPILOT_PORT:-3020}:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ClassPilot MCP: exposes ClassPilot's planner data (units, lessons, outcomes)
  # as MCP tools over Streamable HTTP so Claude Code/Desktop can create and
  # update lesson/unit plans directly. Shares the same SQLite file as the
  # main app (WAL mode); never touches the Student CMS tables.
  classpilot-mcp:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: classpilot-mcp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${CLASSPILOT_MCP_PORT:-3900}:3900"
    volumes:
      - ./data:/app/data
    environment:
      - CLASSPILOT_DATABASE_PATH=/app/data/classpilot.sqlite
      - PORT=3900
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://127.0.0.1:3900/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
